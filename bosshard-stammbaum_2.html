:root{--ink:#1F2A30;--ink2:#5C6B73;--line:#9AA6AD}

#hdr{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:10px 14px;pointer-events:none}
#hdr h1{font-size:15px;font-weight:600;margin:0;background:#fff;padding:3px 6px;border-radius:3px}
#hdr small{color:var(--ink2);font-size:12px;background:#fff;padding:3px 6px;border-radius:3px}
#ctl{position:fixed;bottom:12px;right:12px;z-index:5;display:flex;gap:6px}

#anc-btn{position:fixed;bottom:12px;left:12px;height:38px;z-index:5;width:auto;padding:0 14px;font-size:13px}
#stage{position:absolute;inset:0;cursor:grab}#stage.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;flex-direction:column;align-items:center}
#full{display:none}#world.show-anc #full{display:block}#world.show-anc #tree{display:none}
.root .bx{stroke:var(--ink);stroke-width:2}
.empty .bx{stroke-dasharray:3 3}.empty text{fill:var(--line)}
.bx{fill:#fff;stroke:var(--line);stroke-width:1}
.ln{fill:none;stroke:var(--line);stroke-width:1.1}
text{font-family:inherit;fill:var(--ink);pointer-events:none}
text.name{font-size:11px;font-weight:600;text-anchor:middle}
.sp text.name{font-weight:500}
text.ref{font-size:10px;font-weight:600;fill:var(--ink2);text-anchor:start;font-variant-numeric:tabular-nums}
text.dates{font-size:9px;fill:var(--ink2);text-anchor:middle;font-variant-numeric:tabular-nums}
</style></head><body>

<button id="anc-btn" aria-pressed="false">Ganzer Baum ab 1622</button>
<div id="ctl"><button id="zi" aria-label="Vergrössern">+</button><button id="zo" aria-label="Verkleinern">−</button><button id="fit" aria-label="Gesamten Baum anzeigen">⤢</button></div>
<script>
const stage=document.getElementById('stage'),world=document.getElementById('world');
let s=1,tx=0,ty=0;
function apply(){world.style.transform=`translate(${tx}px,${ty}px) scale(${s})`}
function fit(){const r=world.getBoundingClientRect();const w=r.width/s,h=r.height/s;const vw=stage.clientWidth,vh=stage.clientHeight-100;s=Math.min(vw/(w+24),vh/(h+24),2);if(vh>vw&&s<0.55){s=0.55}tx=(vw-w*s)/2;ty=48;apply()}
function zoomAt(f,cx,cy){const ns=Math.min(Math.max(s*f,.15),4);tx=cx-(cx-tx)*ns/s;ty=cy-(cy-ty)*ns/s;s=ns;apply()}
document.getElementById('zi').onclick=()=>zoomAt(1.25,stage.clientWidth/2,stage.clientHeight/2);
document.getElementById('zo').onclick=()=>zoomAt(.8,stage.clientWidth/2,stage.clientHeight/2);
document.getElementById('fit').onclick=fit;
const ab=document.getElementById('anc-btn');
ab.onclick=()=>{const on=world.classList.toggle('show-anc');ab.setAttribute('aria-pressed',on);ab.textContent=on?'Nur ab Jakob 1870':'Ganzer Baum ab 1622';fit()};
stage.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.1:.9,e.clientX,e.clientY)},{passive:false});
// Mouse / pen: pointer events. Touch: touch events (reliable pinch on iOS Safari).
const pts=new Map();let last=null;
stage.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;pts.set(e.pointerId,1);stage.setPointerCapture(e.pointerId);stage.classList.add('drag');last=[e.clientX,e.clientY]});
stage.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||!pts.has(e.pointerId)||!last)return;tx+=e.clientX-last[0];ty+=e.clientY-last[1];last=[e.clientX,e.clientY];apply()});
const pup=e=>{pts.delete(e.pointerId);if(pts.size===0){stage.classList.remove('drag');last=null}};
stage.addEventListener('pointerup',pup);stage.addEventListener('pointercancel',pup);
let t1=null,tdist=0,tmid=null,lastTap=0;
const mid=t=>[(t[0].clientX+t[1].clientX)/2,(t[0].clientY+t[1].clientY)/2];
const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
stage.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches;if(t.length===1){t1=[t[0].clientX,t[0].clientY];const n=Date.now();if(n-lastTap<300){fit();lastTap=0}else lastTap=n}else if(t.length>=2){t1=null;tdist=dist(t);tmid=mid(t)}},{passive:false});
stage.addEventListener('touchmove',e=>{e.preventDefault();const t=e.touches;if(t.length===1&&t1){tx+=t[0].clientX-t1[0];ty+=t[0].clientY-t1[1];t1=[t[0].clientX,t[0].clientY];apply()}else if(t.length>=2){const d=dist(t),m=mid(t);if(tdist){zoomAt(d/tdist,m[0],m[1])}tx+=m[0]-tmid[0];ty+=m[1]-tmid[1];apply();tdist=d;tmid=m}},{passive:false});
stage.addEventListener('touchend',e=>{const t=e.touches;if(t.length===1){t1=[t[0].clientX,t[0].clientY];tdist=0}else if(t.length===0){t1=null;tdist=0}});
document.addEventListener('gesturestart',e=>e.preventDefault());
window.addEventListener('resize',fit);fit();
</script></body></html>
